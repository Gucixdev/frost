[package]
name = "frost"
version = "0.1.0"
edition = "2021"
description = "small terminal editor: fresh-like UI, micro-like keys, CUA + mouse + multi-cursor, Notepad++-style sessions"
license = "MIT"

[dependencies]
mlua = { version = "0.10", features = ["lua54", "vendored"] }
crossterm = "0.28"
ratatui = "0.29"
ropey = "1.6"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.4", default-features = false, features = ["syntect-fancy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = { version = "3", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
